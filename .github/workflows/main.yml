name: Train RankNet Neural Network

on:
  push:
    branches: [ main, master ]
    paths:
      - 'data/**'
      - 'master_leaderboard_rows.csv'
      - '*.py'
      - '.github/workflows/train.yml'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  train-and-export:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy tensorflow tensorflowjs

      - name: Convert exam data to standard format
        run: |
          python convert_all.py

      - name: Train neural network and export TensorFlow.js model
        run: |
          python train_model.py

      - name: Validate exported model files
        run: |
          ls -la output/ranknet/
          test -f output/ranknet/model.json || exit 1
          test -f output/ranknet/group1-shard1of1.bin || exit 1
          test -f output/ranknet/meta.json || exit 1
          echo "All required TensorFlow.js model files exist and are validated!"

      - name: Upload trained model artifact
        uses: actions/upload-artifact@v4
        with:
          name: ranknet-tfjs-model
          path: |
            output/ranknet/model.json
            output/ranknet/group1-shard1of1.bin
            output/ranknet/meta.json
          retention-days: 30
